name: Send Daily Campaign
on:
  schedule:
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm ci
      - run: node campaignManager.js
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      - name: Commit and push tracking
        run: |
          git config user.name "ReportReady Bot"
          git config user.email "bot@getreportready.com"
          git pull --rebase origin main
          git add outreach_tracking.json
          git diff --staged --quiet || (git commit -m "Update outreach tracking [skip ci]" && git push origin main)
