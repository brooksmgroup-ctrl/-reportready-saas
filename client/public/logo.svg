<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#2d2d2d" />

  <!-- R with integrated emerald-green arrow -->
  <g transform="translate(256,256)" fill="#00b894">
    <!-- Vertical stem of R -->
    <rect x="-120" y="-140" width="42" height="240" rx="8" />

    <!-- Bowl of R (curved top-right) -->
    <path d="M-78,-140
             C-20,-140 40,-120 40,-60
             C40,-10 0,5 -60,0
             L-78,0"
          fill="none" stroke="#00b894" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Arrow leg (diagonal down-right with arrowhead) -->
    <line x1="-78" y1="20" x2="100" y2="160" stroke="#00b894" stroke-width="40" stroke-linecap="round" />

    <!-- Arrowhead -->
    <polygon points="120,140 170,160 110,190" />
  </g>
</svg>
